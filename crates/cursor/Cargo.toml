[package]
name = "cursor"
version = "0.1.0"
edition = "2021"
description = "SVG cursor theme loading and on-demand rasterisation for Wayland compositors"

[dependencies]
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcursor = "0.3"
lru = "0.12"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

