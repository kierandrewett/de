[package]
name = "compositor"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay = { git = "https://github.com/Smithay/smithay.git", features = ["backend_drm", "backend_egl", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "renderer_gl", "renderer_glow", "renderer_pixman", "use_system_lib", "wayland_frontend", "xwayland"] }
calloop = "0.13"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }

# Phase 1 crates
rounding = { path = "../rounding", features = ["tiny-skia"] }
animation = { path = "../animation" }
theme = { path = "../theme" }
ipc = { path = "../ipc" }
cursor = { path = "../cursor" }
text-render = { path = "../text-render" }

# Iced offscreen renderer for SSD title-bar chrome
iced_core = "0.13"
iced_widget = { version = "0.13", features = ["image"] }
iced_runtime = "0.13"
iced_tiny_skia = { version = "0.13", features = ["image"] }
iced_graphics = "0.13"

# Direct cosmic-text dep for shared `Weight` constants used in
# chrome_iced when calling into text-render. The renderer itself lives
# in the `text-render` crate above.
cosmic-text = "0.12"

# Utility
tiny-skia = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
wayland-protocols-misc = { version = "0.3", features = ["server"] }
indexmap = "2"
input = "0.10"

[[bin]]
name = "compositor"
path = "src/main.rs"
