[package]
name = "compositor-slint-spike"
version = "0.1.0"
edition = "2021"

# SPIKE: This crate is a throwaway proof-of-concept. Do not productionise.

[dependencies]
# Wayland compositor plumbing
smithay = { git = "https://github.com/Smithay/smithay.git", features = [
    "wayland_frontend",
    "renderer_gl",
    "use_system_lib",
    "backend_egl",
] }
calloop = "0.13"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }

# Slint UI toolkit — software renderer path (avoids wgpu version conflicts)
# Features: no default backend (we drive the event loop manually via calloop),
# software renderer for blitting to screen.
slint = { version = "1.16", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
] }

# Screen presentation: softbuffer lets us blit CPU pixels to any winit window
softbuffer = "0.4"
winit = "0.30"

# Utility
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Time
chrono = "0.4"

[[bin]]
name = "compositor-slint-spike"
path = "src/main.rs"
