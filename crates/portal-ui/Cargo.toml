[package]
name = "portal-ui"
version = "0.1.0"
edition = "2021"
description = "File chooser and color picker UI for the myDE xdg-desktop-portal backend"
license = "MIT"
authors = ["Kieran Drewett"]

[dependencies]
iced = { version = "0.13", features = ["advanced"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }

[[bin]]
name = "portal-ui"
path = "src/main.rs"
