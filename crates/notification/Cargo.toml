[package]
name = "notification"
version = "0.1.0"
edition = "2021"
description = "org.freedesktop.Notifications D-Bus server for the desktop environment"
license = "MIT"
authors = ["Kieran Drewett"]

[dependencies]
zbus = { version = "5", features = [] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"

[[bin]]
name = "notification"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
