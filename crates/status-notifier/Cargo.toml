[package]
name = "status-notifier"
version = "0.1.0"
edition = "2021"
description = "D-Bus StatusNotifierWatcher and host for system tray icons (SNI protocol)"
license = "MIT"
authors = ["Kieran Drewett"]

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
freedesktop-icons = "0.2"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
