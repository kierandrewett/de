[package]
name = "shell-panel"
version = "0.1.0"
edition = "2021"
description = "Top panel, control centre, and date/time popout for the Wayland DE"
license = "MIT"
authors = ["Kieran Drewett"]

[[bin]]
name = "shell-panel"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
iced_layershell = "0.18.0-beta4"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4" }
futures = "0.3"

ipc = { path = "../ipc" }
status-notifier = { path = "../status-notifier" }
