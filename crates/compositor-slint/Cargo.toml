[package]
name = "compositor-slint"
version = "0.1.0"
edition = "2021"

# GPU migration of compositor-slint-spike.
# Replaces SoftwareRenderer + softbuffer with FemtoVGWGPURenderer + wgpu swapchain.
# SHM client buffers uploaded as wgpu textures (CPU memcpy path).
# DMA-BUF: documented blocker, SHM-only for now.

[dependencies]
# Wayland compositor plumbing
smithay = { git = "https://github.com/Smithay/smithay.git", features = [
    "wayland_frontend",
    "renderer_gl",
    "use_system_lib",
    "backend_egl",
    "desktop",
] }
calloop = "0.13"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
wayland-protocols-misc = { version = "0.3", features = ["server"] }

# Slint UI toolkit — GPU renderer via FemtoVG + wgpu-28
# renderer-femtovg-wgpu enables FemtoVGWGPURenderer
# unstable-wgpu-28 exposes the wgpu-28 integration API and re-exports
slint = { version = "1.16", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-28",
] }

# wgpu 28 — required by Slint FemtoVGWGPURenderer.
# Cargo allows this to coexist with wgpu-27 used by iced 0.14 in other crates.
wgpu = "28.0.0"

# raw-window-handle 0.6 — for creating wgpu Surface from winit window
raw-window-handle = "0.6"

# pollster — block_on() for wgpu adapter/device requests (no tokio needed here)
pollster = "0.3"

# winit 0.30 — window creation + pump_app_events for interleaving with calloop
winit = "0.30"

# Utility
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

# bytemuck — safe bytes casting for wgpu uniform buffers
bytemuck = { version = "1", features = ["derive"] }

# Time
chrono = "0.4"

# Wallpaper loading
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Dock: .desktop file parsing + icon resolution
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SVG icon decode for dock items (resvg rasterises SVG → RGBA at any size).
# Pulls in usvg + tiny-skia transitively.
resvg = "0.44"

# DMA-BUF two-stage import: smithay imports DMA-BUF via EGL/GLES, we read
# pixels back to CPU and upload as a wgpu texture.  All EGL/GLES symbols come
# from smithay's renderer_gl + backend_egl features (already enabled above).
# drm-fourcc is re-exported by smithay's allocator module so no direct dep needed.

[[bin]]
name = "compositor-slint"
path = "src/main.rs"

[build-dependencies]
# Compiles slint/Compositor.slint and its imported sub-components into Rust.
slint-build = "1.16"
