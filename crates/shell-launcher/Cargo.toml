[package]
name = "shell-launcher"
version = "0.1.0"
edition = "2021"
description = "Spotlight-style application launcher for the Wayland desktop environment"
license = "MIT"
authors = ["Kieran Drewett"]

[[bin]]
name = "shell-launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["advanced"] }
nucleo = "0.5"
meval = "0.2"
quick-xml = "0.37"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
theme = { path = "../theme" }
animation = { path = "../animation" }
rounding = { path = "../rounding" }
ipc = { path = "../ipc" }
