[workspace]
resolver = "2"
members = [
    "crates/rounding",
    "crates/animation",
    "crates/cursor",
    "crates/theme",
    "crates/ipc",
    "crates/shell-devtools",
    "crates/compositor",
    "crates/notification",
    "crates/status-notifier",
    "crates/portal",
    "crates/portal-ui",
    "crates/shell-launcher",
    "crates/shell-dock",
    "crates/shell-panel",
    "crates/text-render",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Kieran Drewett"]

[workspace.dependencies]
tiny-skia = "0.11"
resvg = "0.44"
usvg = "0.44"
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Vendored fork of iced_tiny_skia 0.14.0 with a single patch:
# `present()` always issues full damage rather than trusting
# `softbuffer::Buffer::age()`, which lies on Wayland with wl_shm and causes
# the panel/dock to fade to black on partial-damage repaints (mouse hover,
# clock tick, etc.). See `vendor/iced_tiny_skia/src/window/compositor.rs`
# for the patch comment. Drop this `[patch]` if iced upstream fixes the
# softbuffer interaction or if we move to wgpu for the shell apps.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
