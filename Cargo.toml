[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Kieran Drewett"]

[workspace.dependencies]
tiny-skia = "0.11"
resvg = "0.44"
usvg = "0.44"
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
